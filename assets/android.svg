             V 280
             A 30 30 0 0 1 250 310
             H 150
             A 30 30 0 0 1 120 280
             Z" />

    
    <rect x="76" y="138" width="36" height="136" rx="18" />

    
    <rect x="288" y="138" width="36" height="136" rx="18" />

    
